    organisation: Qlik
    poste: Senior Product Designer, Data Integration
    contexte: Enterprise data platform, convergence of the Talend and Qlik products.
    realisations:
      - titre: Data products
        texte: business glossaries and data contracts, which make vocabulary, responsibilities and guarantees explicit between data producers and consumers; cost visibility (FinOps).
      - titre: Design system
        texte: templates for the unified experience across Talend and Qlik products.
      - titre: AI and prototyping
        texte: automating design work and building working prototypes with Claude and Figma Make.
