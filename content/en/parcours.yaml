# Background page, English version (Figma node 9:1964)

titre: Background
description: "Background of Florian Butour, Senior Product Designer: more than ten years of product design on highly complex B2B products."
introduction: "More than ten years of product design on highly complex B2B products: data platforms, industrial tools, multi-product SaaS. I design the structure of the product, its roles, its objects and its rules, then the systems that keep it consistent as it grows."
voirTravaux: See the work
cv: Résumé

experiences:
