    poste: Principal Product Designer
    contexte: "Smart office: space booking, presence management, sensors, digital signage."
    realisations:
      - titre: WorkplaceToBe
        texte: redesign as a modular offer, with modules sold separately, aligned with sales and unified across web, mobile and Outlook.
      - titre: Design system
